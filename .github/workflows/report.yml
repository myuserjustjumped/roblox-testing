name: Reporter

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: reporter-${{ github.repository }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  REPORT_MAX_RUNTIME_SECONDS: '17400'
  COOLDOWN_SECONDS: '180'
  STATE_PUSH_INTERVAL: '300'
  REFRESH_WORKERS: '10'
  REFRESH_TIMEOUT: '30'
  REFRESH_RETRIES: '2'
  REFRESH_MAX_SECONDS: '900'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Chain gate
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" != "schedule" ]; then
            echo "event=${EVENT_NAME} -> chain gate bypassed"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          wf_file="$(basename "${GITHUB_WORKFLOW_REF%%@*}")"
          others="$(
            gh api -X GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf_file}/runs?per_page=100" \
              --jq "[.workflow_runs[]
                     | select(.id != ${RUN_ID})
                     | select(.status == \"in_progress\"
                           or .status == \"queued\"
                           or .status == \"waiting\"
                           or .status == \"pending\"
                           or .status == \"requested\")]
                    | length"
          )"

          if [ "${others:-0}" -gt 0 ]; then
            echo "chain already alive (${others} run(s) in flight); scheduled start skipped"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "no chain running; scheduled start takes over"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cooldown guard
        if: steps.gate.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          if [ ! -f .last_run_end ]; then
            echo "first run; no cooldown needed"
            exit 0
          fi
          last_end="$(tr -dc '0-9' < .last_run_end || true)"
          if [ -z "${last_end}" ]; then
            echo "::warning::.last_run_end is not a unix timestamp; ignoring"
            exit 0
          fi
          target=$((last_end + COOLDOWN_SECONDS))
          now="$(date +%s)"
          if [ "${now}" -lt "${target}" ]; then
            sleep_for=$((target - now))
            echo "cooling down for ${sleep_for}s"
            sleep "${sleep_for}"
          else
            echo "cooldown satisfied"
          fi

      - name: Refresh cookies
        id: refresh
        if: steps.gate.outputs.proceed == 'true'
        continue-on-error: true
        timeout-minutes: 20
        env:
          COOKIES_PAT: ${{ secrets.COOKIES_PAT }}
          COOKIES_REPO: ${{ vars.COOKIES_REPO }}
          COOKIES_REF: ${{ vars.COOKIES_REF || 'main' }}
        run: |
          set -euo pipefail
          umask 077
          printf 'cookies.txt\n' >> .git/info/exclude
          python refresh.py

      - name: Run script
        id: run
        if: steps.gate.outputs.proceed == 'true'
        continue-on-error: true
        env:
          REPORT_CATEGORY_VAR: ${{ vars.REPORT_CATEGORY }}
          REPORT_CATEGORY_SEC: ${{ secrets.REPORT_CATEGORY }}
          REPORT_SURFACE_VAR: ${{ vars.REPORT_SURFACE }}
          REPORT_SURFACE_SEC: ${{ secrets.REPORT_SURFACE }}
          REPORT_COMMENT_VAR: ${{ vars.REPORT_COMMENT }}
          REPORT_COMMENT_SEC: ${{ secrets.REPORT_COMMENT }}
          COOKIES_PAT: ${{ secrets.COOKIES_PAT }}
          COOKIES_REPO: ${{ vars.COOKIES_REPO }}
          COOKIES_REF: ${{ vars.COOKIES_REF || 'main' }}
        run: |
          set -uo pipefail
          pick() {
            local v="$1" s="$2" n="$3"
            if [ -n "${v}" ]; then
              export "${n}=${v}"; echo "  ${n} from repository variable"
            elif [ -n "${s}" ]; then
              export "${n}=${s}"; echo "  ${n} from repository secret"
            else
              echo "  ${n} not set; using script default"
            fi
          }
          echo "configuration:"
          pick "$REPORT_CATEGORY_VAR" "$REPORT_CATEGORY_SEC" REPORT_CATEGORY
          pick "$REPORT_SURFACE_VAR"  "$REPORT_SURFACE_SEC"  REPORT_SURFACE
          pick "$REPORT_COMMENT_VAR"  "$REPORT_COMMENT_SEC"  REPORT_COMMENT
          unset REPORT_CATEGORY_VAR REPORT_CATEGORY_SEC REPORT_SURFACE_VAR \
                REPORT_SURFACE_SEC REPORT_COMMENT_VAR REPORT_COMMENT_SEC

          keeper_pid=""
          if [ "${STATE_KEEPER:-1}" = "1" ]; then
            (
              while true; do
                sleep "${STATE_PUSH_INTERVAL:-300}"
                bash ci/commit_state.sh 2 || echo "::warning::state keeper push failed"
              done
            ) &
            keeper_pid=$!
            echo "state keeper started (every ${STATE_PUSH_INTERVAL:-300}s, pid ${keeper_pid})"
          fi
          stop_keeper() {
            if [ -n "${keeper_pid}" ]; then
              kill "${keeper_pid}" 2>/dev/null || true
              wait "${keeper_pid}" 2>/dev/null || true
              keeper_pid=""
            fi
          }
          trap stop_keeper EXIT
          trap 'stop_keeper; exit 143' TERM INT

          set +e
          python report.py
          RUN_EXIT=$?
          set -e
          stop_keeper

          echo "python_exit=${RUN_EXIT}" >> "$GITHUB_OUTPUT"
          echo "script exited with code ${RUN_EXIT}"
          if [ "${RUN_EXIT}" != "0" ]; then
            echo "::warning::report.py exited non-zero (code ${RUN_EXIT})"
          fi
          exit "${RUN_EXIT}"

      - name: Schedule next run
        if: always() && steps.gate.outputs.proceed == 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          wf_file="$(basename "${GITHUB_WORKFLOW_REF%%@*}")"

          pending="$(
            gh api -X GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf_file}/runs?per_page=100" \
              --jq "[.workflow_runs[]
                     | select(.id != ${RUN_ID})
                     | select(.status == \"queued\"
                           or .status == \"pending\"
                           or .status == \"waiting\"
                           or .status == \"requested\")]
                    | length"
          )"

          if [ "${pending:-0}" -gt 0 ]; then
            echo "a successor is already queued (${pending}); not dispatching another"
            exit 0
          fi

          for attempt in 1 2 3; do
            if gh workflow run "${wf_file}" --ref "${BRANCH}"; then
              echo "next run dispatched on ${BRANCH}"
              exit 0
            fi
            echo "::warning::dispatch failed (attempt ${attempt}/3)"
            sleep $((attempt * 5))
          done
          echo "::error::could not dispatch the next run"
          exit 1

      - name: Commit progress
        if: always() && steps.gate.outputs.proceed == 'true'
        timeout-minutes: 10
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          if bash ci/commit_state.sh 5 --touch-last-run; then
            echo "state committed and pushed"
          else
            echo "::warning::final state push failed; the keeper's last push still holds the ledger"
            exit 1
          fi
